[package]
name = "piui-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "PiUI desktop host"

[lib]
name = "piui_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "piui-desktop"
path = "src/main.rs"

[[test]]
name = "native-prime-scheduler"
path = "tests/native_prime_scheduler.rs"
required-features = ["native-prime-scheduler-test"]

[features]
e2e-webview-automation = []
native-prime-scheduler-test = []

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
chrono.workspace = true
chrono-tz.workspace = true
piui-contracts = { path = "../../../crates/piui-contracts" }
piui-extensions = { path = "../../../crates/piui-extensions" }
piui-index = { path = "../../../crates/piui-index" }
piui-orchestration = { path = "../../../crates/piui-orchestration" }
piui-platform = { path = "../../../crates/piui-platform" }
piui-runtime = { path = "../../../crates/piui-runtime" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
uuid.workspace = true
tauri = { version = "=2.11.5", features = ["tray-icon"] }
rfd = "0.17.2"
# Signed updates. Registered only when the build config carries the updater
# public key and an HTTPS endpoint (see app_update.rs and docs/RELEASING.md).
tauri-plugin-updater = { version = "=2.12.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
base64 = "0.22.1"
minisign-verify = "0.2.5"
notify = "8.2.0"
# Sign-in registration for background mode on Linux and macOS; driven only
# from host code. Windows writes its quoted Run value itself (autostart.rs).
tauri-plugin-autostart = "=2.5.1"
# One PiUI process per user session: a second launch shows the first one.
tauri-plugin-single-instance = "=2.4.5"

[target.'cfg(windows)'.dependencies]
# The quoted HKCU Run value for "start PiUI when I sign in".
winreg = "=0.10.1"

[dev-dependencies]
tauri = { version = "=2.11.5", features = ["test"] }
# Test-only adapter constructor that runs the real bridge runner and transport.
piui-runtime = { path = "../../../crates/piui-runtime", features = ["test-support"] }
