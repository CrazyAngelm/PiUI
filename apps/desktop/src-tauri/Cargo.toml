[package]
name = "piui-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "PiUI desktop host"

[lib]
name = "piui_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "piui-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
piui-contracts = { path = "../../../crates/piui-contracts" }
piui-extensions = { path = "../../../crates/piui-extensions" }
piui-index = { path = "../../../crates/piui-index" }
piui-platform = { path = "../../../crates/piui-platform" }
piui-runtime = { path = "../../../crates/piui-runtime" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
tauri = { version = "=2.11.5", features = [] }
rfd = "0.17.2"
notify = "8.2.0"
