[package]
name = "piui-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "PiUI desktop host"

[lib]
name = "piui_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "piui-desktop"
path = "src/main.rs"

[[test]]
name = "native-prime-scheduler"
path = "tests/native_prime_scheduler.rs"
required-features = ["native-prime-scheduler-test"]

[features]
e2e-webview-automation = []
native-prime-scheduler-test = []

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
chrono.workspace = true
piui-contracts = { path = "../../../crates/piui-contracts" }
piui-extensions = { path = "../../../crates/piui-extensions" }
piui-index = { path = "../../../crates/piui-index" }
piui-orchestration = { path = "../../../crates/piui-orchestration" }
piui-platform = { path = "../../../crates/piui-platform" }
piui-runtime = { path = "../../../crates/piui-runtime" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
uuid.workspace = true
tauri = { version = "=2.11.5", features = [] }
rfd = "0.17.2"
notify = "8.2.0"

[dev-dependencies]
tauri = { version = "=2.11.5", features = ["test"] }
