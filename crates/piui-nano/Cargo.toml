[package]
name = "piui-nano"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
authors.workspace = true
description = "Nano account sign-in, credential custody and the loopback model relay of Nano Desktop"

[dependencies]
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# rustls without a bundled provider: the crate builds its own ring-based TLS
# configuration with the platform verifier (no aws-lc, no native-tls).
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider", "system-proxy"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
semver = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2.6"
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
url = "2.5"
zeroize = "1"

# Windows Credential Manager and the macOS Keychain. Other platforms keep the
# refresh token in memory only (see `store::default_os_store`).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native", "apple-native"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
