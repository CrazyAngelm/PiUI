[package]
name = "piui-nano"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
authors.workspace = true
description = "Nano account sign-in, credential custody and the loopback model relay of Nano Desktop"

[dependencies]
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
getrandom = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# rustls without a bundled provider: the crate builds its own ring-based TLS
# configuration with the platform verifier (no aws-lc, no native-tls).
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider", "system-proxy"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
semver = "1"
serde.workspace = true
# `raw_value` carries remote event payloads through without parsing them.
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
subtle = "2.6"
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
# Frames the stream `reqwest` upgraded (the remote link, ADR-062): no TLS, no
# connect feature, so the issuer pin, the platform verifier and the proxy
# rules of the account's HTTP client apply unchanged.
tokio-tungstenite = { version = "0.29", default-features = false }
url = "2.5"
zeroize = "1"

# Windows Credential Manager and the macOS Keychain.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native", "apple-native"] }

# Use the desktop Secret Service with encrypted D-Bus transfers and no new
# native build dependency. Desktops without Secret Service fall back to memory.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }
dbus = "0.9"
dbus-secret-service = "4.1"

[dev-dependencies]
tempfile = "3"
# The in-process loopback server of the remote link tests.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[lints.rust]
unsafe_code = "forbid"
