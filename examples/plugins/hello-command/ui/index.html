<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hello panel</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main aria-labelledby="title">
      <h1 id="title">Hello panel</h1>
      <p id="chat" aria-live="polite">Waiting for PiUI…</p>

      </div>
    </main>
    <script src="piui-panel.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
