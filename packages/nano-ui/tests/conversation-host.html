<!doctype html>
<html lang="fr" data-theme="light">
<head><meta charset="utf-8"><title>Conversation owner boundary</title><link rel="stylesheet" href="/dist-conversation/nano-conversation.css"><style>body { background: linen; } #conversation, #second { height: 650px; } .nano-conversation-root { height: 100%; }</style></head>
<body><h1>Host conversation fixture</h1><div id="conversation"></div><div id="second"></div>
<script type="module">
  import { mountConversation, attachComposer } from '/dist-conversation/nano-conversation.js';
  let handle, second, current, view;
  const log = [];
  const waits = new Map();
  const held = new Set();
  const failures = new Set();
  const snapshot = sessionId => ({
    blocks: [
      { id: 'user', kind: 'user', text: 'Please read the notes\n[image]', status: 'complete' },
      { id: 'tool', kind: 'tool', toolName: 'unregistered_tool', title: 'Unregistered tool', text: 'Generic tool output', fallback: true, status: 'complete' },
      { id: 'unknown', kind: 'unknown', label: 'Future event', text: '<img src=x onerror=alert(1)>Readable unknown content', fallback: true, status: 'complete' },
      { id: 'answer', kind: 'assistant', text: 'Starting ' + sessionId, status: 'streaming' },
    ],
    approvals: [{ id: 'approval', sessionId, kind: 'command', title: 'Run tests for ' + sessionId, description: 'Run the project test command', decisions: ['approve-once', 'deny'] }],
    attachments: [{ id: 'notes', blockId: 'user', label: 'notes.txt', mediaType: 'text/plain' }], connection: 'connected', loading: false,
  });
  async function operation(name, owner, signal, payload, result) {
    log.push({ name, ...owner, payload });
    signal.addEventListener('abort', () => log.push({ name: 'aborted', operation: name, ...owner }), { once: true });
    if (failures.delete(name)) throw new Error('Owner operation failed');
    if (held.delete(name)) await new Promise((resolve, reject) => waits.set(name, { resolve, reject }));
    return result;
  }
  function owner(location, sessionId) {
    const identity = { location, scopeId: location === 'native' ? 'workspace' : 'account', sessionId };
    return { identity,
      readHistory: signal => operation('history', identity, signal, null, [{ id: 'history', kind: 'assistant', text: 'Private history ' + sessionId, status: 'complete' }]),
      openAttachment: (id, signal) => operation('attachment', identity, signal, id),
      respond: (id, decision, answer, signal) => operation('approval', identity, signal, { id, decision, answer }),
      reconnect: signal => operation('reconnect', identity, signal, null, { ...snapshot(sessionId), approvals: [], blocks: [{ id: 'restored', kind: 'assistant', text: 'Recovered ' + sessionId, status: 'complete' }], attachments: [] }),
      actOnMessage: async (id, action, signal) => {
        await operation('message', identity, signal, { id, action });
        if (signal.aborted || current.identity.sessionId !== identity.sessionId || current.identity.scopeId !== identity.scopeId) return;
        if (action === 'copy') {
          view = { ...view, messageControls: view.messageControls.map(item => ({ ...item, copied: item.id === id })) };
          handle.update(identity, view);
        }
      },
    };
  }
  window.nanoConversationFixture = {
    async mount(location = 'cloud', fullHistory = true) {
      await handle?.dispose(); log.length = 0; held.clear(); waits.clear(); failures.clear();
      current = owner(location, 'first'); view = snapshot('first');
      if (!fullHistory) delete current.readHistory;
      handle = mountConversation(document.getElementById('conversation'), { contractVersion: 1, language: 'en', appearance: 'light', agentLabel: 'Agent', owner: current, snapshot: view });
    },
    async mountRich() {
      await handle?.dispose(); log.length = 0; held.clear(); waits.clear(); failures.clear();
      current = owner('cloud', 'rich');
      current.resolveAttachment = (id, signal) => operation('media', current.identity, signal, id,
        {src:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+j4FcAAAAASUVORK5CYII='});
      current.downloadAttachment = (id, signal) => operation('download', current.identity, signal, id);
      current.loadOlder = async signal => {
        await operation('older', current.identity, signal);
        view = {...view, olderAvailable:false, blocks:[{id:'earlier',kind:'assistant',text:'Earlier history',status:'complete'},...view.blocks]};
        handle.update(current.identity,view);
      };
      current.decorateMessage = (root, block, signal) => {
        if(block.id !== 'answer') return;
        const input=document.createElement('input');input.setAttribute('aria-label','Owner widget');root.append(input);
        log.push({name:'decorated',...current.identity});
        signal.addEventListener('abort',()=>log.push({name:'decoration-abort'}),{once:true});
        return {update(){log.push({name:'decoration-update'});},dispose(){input.remove();log.push({name:'decoration-dispose'});}};
      };
      view={...snapshot('rich'),approvals:[],olderAvailable:true,
        presentation:[{blockId:'user',literal:true},{blockId:'answer',author:'Cloud author'}],
        attachments:[{id:'picture',blockId:'answer',label:'Picture',presentation:'image',downloadable:true},
          {id:'missing',blockId:'answer',label:'Unavailable file',unavailable:true,detail:'Upload interrupted',progress:25}]};
      handle=mountConversation(document.getElementById('conversation'),{contractVersion:1,language:'en',agentLabel:'Agent',owner:current,snapshot:view});
    },
    async mountPolicy() {
      await handle?.dispose(); log.length=0;
      current=owner('native','policy');
      // A decoration hook permits rich typed tokens, but grants no URL-loading authority.
      current.decorateMessage=()=>({update(){},dispose(){}});
      view={...snapshot('policy'),historyFailed:true,attachments:[],blocks:[
        {id:'policy-image',kind:'assistant',status:'complete',text:'![Inert image](https://example.invalid/shared-policy.png) ![Unsafe image](javascript:alert(1))'},
        {id:'policy-long',kind:'assistant',status:'complete',text:'Reader line\n'.repeat(window.innerHeight)}
      ]};
      handle=mountConversation(document.getElementById('conversation'),{contractVersion:1,language:'en',agentLabel:'Agent',announceMessages:true,owner:current,snapshot:view});
      await handle.ready();
    },
    scroll(force) { return handle.scrollToEnd(force,false); },
    stream() { view = { ...view, blocks: view.blocks.map(block => block.id === 'answer' ? { ...block, text: 'Streamed final answer', status: 'complete' } : block) }; handle.update(current.identity, view); },
    loadOlder() { view = { ...view, blocks: [{ id: 'older', kind: 'assistant', text: 'Older final answer', status: 'complete' }, ...view.blocks] }; handle.update(current.identity, view); },
    replaceWindow() { view = { ...view, blocks: [{ id: 'replacement', kind: 'assistant', text: 'Replacement final answer', status: 'complete' }], attachments: [] }; handle.update(current.identity, view); },
    longApproval() { view = { ...view, approvals: view.approvals.map(approval => ({ ...approval, description: 'Multiline command details\n'.repeat(window.innerHeight) })) }; handle.update(current.identity, view); },
    enableMessageActions() {
      view = { ...view, messageControls: [
        { id: 'user-content-v1', blockId: 'user', actions: [{kind:'copy'}, {kind:'edit'}, {kind:'branch'}] },
        { id: 'answer-content-v1', blockId: 'answer', actions: [{kind:'copy'}, {kind:'repeat',disabled:true}, {kind:'refresh'}], usage: {label:'7 credits',description:'Owner supplied usage'} },
      ] }; handle.update(current.identity, view);
    },
    allowRepeat() { view = { ...view, messageControls: view.messageControls.map(item => item.blockId === 'answer' ? {...item,actions:[{kind:'copy'},{kind:'repeat'}]} : item) }; handle.update(current.identity,view); },
    replaceMessageTarget() { view = { ...view, messageControls: view.messageControls.map(item => item.blockId === 'user' ? {...item,id:'user-content-v2'} : item), blocks: view.blocks.map(block=>block.id==='user'?{...block,text:'Replacement question'}:block) }; handle.update(current.identity,view); },
    clickStaleOwnerButton() {
      const button = document.querySelector('#conversation [data-timeline-block="user"] [aria-label="Copy message"]');
      const original = current.identity;
      handle.setOwner(owner(original.location, 'between'), { ...view, approvals: [] });
      current = owner(original.location, original.sessionId);
      handle.setOwner(current, view);
      button.click();
    },
    clickStaleContentButton() {
      const button = document.querySelector('#conversation [data-timeline-block="user"] [aria-label="Copy message"]');
      window.nanoConversationFixture.replaceMessageTarget();
      button.click();
    },
    disconnect() { view = { ...view, connection: 'disconnected' }; handle.update(current.identity, view); },
    hold(name) { held.add(name); }, fail(name) { failures.add(name); },
    settle(name, fail = false) { const wait = waits.get(name); waits.delete(name); if (fail) wait.reject(new Error('Old owner failed')); else wait.resolve(); },
    switchOwner() { current = owner(current.identity.location === 'native' ? 'cloud' : 'native', 'second'); view = snapshot('second'); handle.setOwner(current, view); },
    calls() { return log; },
    mountSecond() { second = mountConversation(document.getElementById('second'), { contractVersion: 1, language: 'ru', agentLabel: 'Агент', owner: owner('cloud', 'russian'), snapshot: snapshot('russian') }); },
    async dispose() { await handle?.dispose(); await second?.dispose(); },
  };
  let editorHandle, editor, editorRoot, touch = false, menu = false;
  const submits = [];
  function editorOptions(name) {
    return { contractVersion: 1, autoGrow: { minRows: 1, maxRows: 14 }, touchOnly: () => touch,
      beforeKeyDown(event) { if (menu && event.key === 'Enter') { event.preventDefault(); menu = false; submits.push('menu'); } },
      onSubmit() { submits.push(name); }
    };
  }
  window.nanoComposerFixture = {
    mount() {
      editorRoot = document.createElement('section'); editorRoot.dataset.nanoComposer = 'root';
      editorRoot.dataset.theme = 'light'; editorRoot.style.width = '600px';
      const surface = document.createElement('div'); surface.dataset.nanoComposer = 'surface';
      editor = document.createElement('textarea'); editor.dataset.nanoComposer = 'editor'; editor.setAttribute('aria-label', 'Shared draft');
      surface.append(editor); editorRoot.append(surface); document.body.prepend(editorRoot);
      editorHandle = attachComposer(editor, editorOptions('first'));
    },
    touch(value) { touch = value; }, menu() { menu = true; },
    update() { editorHandle.update(editorOptions('second')); },
    replace() { const old = editorHandle; editorHandle = attachComposer(editor, editorOptions('replacement')); old.dispose(); },
    narrow() { editorRoot.style.width = '180px'; },
    calls() { return submits; }, dispose() { editorHandle.dispose(); },
  };
  window.nanoPrintFixture = {
    async mount() {
      const identity = { location: 'cloud', scopeId: 'print-proof', sessionId: 'full' };
      // One more than the existing 120-row interactive window, plus readable tool output.
      const blocks = Array.from({ length: 121 }, (_, i) => ({ id: `printed-${i}`, kind: 'assistant', status: 'complete', text: `Printed message ${i}`, createdAt: '2026-11-14T01:00:00Z' }));
      blocks.push({ id: 'print-tool', kind: 'tool', status: 'complete', toolName: 'read', text: 'Complete printable tool result' });
      blocks[1].text += '\n\n```javascript\nconst printed = true;\n```';
      const snapshot = { blocks, approvals: [{id:'print-approval',sessionId:'full',kind:'command',title:'Never offer print approval',decisions:['approve-once']}], attachments: [{ id:'print-image',blockId:'printed-0',label:'Printed image',presentation:'image',downloadable:true }], connection:'connected',loading:false,
        messageControls:[{id:'print-action',blockId:'printed-0',actions:[{kind:'copy'}]}],presentation:[{blockId:'printed-0',author:'Generic author'}] };
      handle = mountConversation(document.getElementById('conversation'), {contractVersion:1,language:'en',appearance:'light',agentLabel:'Nano',mode:'print',snapshot,
        owner:{identity,readHistory:()=>{throw new Error('Print must use the provided complete snapshot');},
          resolveAttachment:async()=>({src:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/l9sAAAAASUVORK5CYII='}),
          decorateMessageHeader(element,block) { if(block.id==='printed-0'){element.textContent='Owner author and day';element.dataset.active='true';} return {update(){},dispose(){element.replaceChildren();}}; },
          openAttachment:()=>{throw new Error('Print cannot open files');},actOnMessage:()=>{throw new Error('Print cannot act');},respond:()=>{throw new Error('Print cannot approve');}}
      });
      await handle.ready();
    }
  };
</script></body></html>
