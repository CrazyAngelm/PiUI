[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/piui-contracts",
  "crates/piui-extensions",
  "crates/piui-index",
  "crates/piui-platform",
  "crates/piui-runtime",
  "crates/piui-orchestration",
  "crates/piui-plugins",
  "crates/piui-nano",
]
exclude = ["spikes/webview-baseline/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Nano Desktop contributors"]
description = "A desktop workbench for native agent harnesses and multi-agent pipelines"
keywords = ["pi", "tauri", "desktop", "agent"]
categories = ["development-tools", "gui"]

[workspace.dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std"] }
libc = "0.2.189"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }

# Sixteen units compile the large desktop crate on every core. One unit made
# its code generation a single thread, the longest step of a release build.
[profile.release]
codegen-units = 16
lto = "thin"
strip = "symbols"

# Tests and the dev app need line numbers in backtraces, not full debug info:
# it only inflates target/ and slows every link.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
