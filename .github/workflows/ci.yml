name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm repo:check
      - run: python tools/validate_spec.py
      - run: python tools/validate_runtime_evidence.py --check evidence/upstream/npm/earendil-works-pi-coding-agent/0.81.1
      - run: python -m unittest tools/test_validate_runtime_evidence.py -v
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm perf:smoke
      - run: pnpm contract:test

  rust-core:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # A Windows green build must exercise final-component and ancestor-directory
      # reparse rejection; missing symlink capability is evidence failure, not a skip.
      PIUI_REQUIRE_WINDOWS_REPARSE_TEST: ${{ matrix.os == 'windows-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p piui-contracts -p piui-extensions -p piui-index -p piui-platform -p piui-runtime --all-targets -- -D warnings
      - run: cargo test -p piui-contracts -p piui-extensions -p piui-index -p piui-platform -p piui-runtime

  tauri-windows:
    name: Tauri no-bundle build (Windows)
    runs-on: windows-latest
    needs: [frontend, rust-core]
    env:
      PIUI_REQUIRE_WINDOWS_REPARSE_TEST: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.94.1
      - run: pnpm install --frozen-lockfile
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm --filter @piui/desktop tauri build --no-bundle
