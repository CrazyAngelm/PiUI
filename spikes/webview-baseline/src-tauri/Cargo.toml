[package]
name = "piui-webview-baseline"
version = "0.0.1"
description = "SPIKE-08 minimal Tauri WebView baseline"
authors = ["PiUI contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.85"

[lib]
name = "piui_webview_baseline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "piui-webview-baseline"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
